on:
  push:
    branches:
      - "main"
    tags-ignore:
      - "**"
  workflow_dispatch:

concurrency:
  group: format('branch-{0}', github.ref_name)

jobs:
  build_wheels:
    outputs:
      version: ${{ steps.build.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        os: [
            {
              family: "linux",
              runner: "ubuntu-22.04",
              arch: "x86_64",
            },
            {
              family: "linux",
              runner: "ubuntu-22.04-arm",
              arch: "aarch64",
            },
            {
              family: "macos",
              runner: "macos-15",
              arch: "arm64",
            },
          ]
    name: Build Wheels | ${{ matrix.os.runner }} | ${{ matrix.os.arch }}
    runs-on: ${{ matrix.os.runner }}
    steps:
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
            bazelisk-cache: true
            disk-cache: true
            repository-cache: true 
      - uses: actions/checkout@v7
      - id: get_openroad_rev
        name: Get OpenROAD revision
        run: |
          echo "rev=$(perl -ne 'print /rev: (.+)/' ./openroad_version.yml)" >> $GITHUB_OUTPUT
      - name: Download OpenROAD Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          repository: The-OpenROAD-Project/OpenROAD
          submodules: recursive
          ref: ${{ steps.get_openroad_rev.outputs.rev }}
          path: openroad-repo
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Dependencies
        run: |
          make venv
      - id: build
        name: Build
        run: |
          source ./venv/bin/activate
          python3 -m build_wheel openroad-repo
      - name: Smoke Test
        run: |
          make test
      - name: Upload Wheels
        uses: actions/upload-artifact@v7
        with:
          name: openroad-python-wheels-${{ matrix.os.runner }}-${{ matrix.os.arch }}
          path: ./dist/*
  upload_wheels:
    name: Upload Wheels
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    needs: build_wheels
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: python-wheels-*
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: '${{ needs.build_wheel.outputs.version }}'
        run: |
          gh release create "v$TAG" dist/*.whl \
            --prerelease \
            --repo '${{ github.repository }}' \
            --target '${{ github.sha }}' \
            --generate-notes
      # - name: Publish
      #   uses: pypa/gh-action-pypi-publish@release/v1
