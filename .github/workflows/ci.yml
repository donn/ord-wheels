on:
  push:
  workflow_dispatch:

jobs:
  build_wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [
            {
              name: "Ubuntu 22.04",
              family: "linux",
              runner: "ubuntu-22.04",
              arch: "x86_64",
            },
            {
              name: "Ubuntu 22.04",
              family: "linux",
              runner: "ubuntu-22.04-arm",
              arch: "aarch64",
            },
            {
              name: "macOS 15",
              family: "macos",
              runner: "macos-15",
              arch: "arm64",
            },
          ]
    name: Build Wheels | ${{ matrix.os.name }} | ${{ matrix.os.arch }}
    runs-on: ${{ matrix.os.runner }}
    steps:
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
            bazelisk-cache: true
            disk-cache: true
            repository-cache: true 
      - uses: actions/checkout@v7
      - id: get_openroad_rev
        name: Get OpenROAD revision
        run: |
          echo "rev=$(perl -ne 'print /rev: (.+)/' ./openroad_version.yml)" >> $GITHUB_OUTPUT
      - name: Download OpenROAD Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          repository: The-OpenROAD-Project/OpenROAD
          submodules: recursive
          ref: ${{ get_openroad_rev.outputs.rev }}
          path: openroad-repo
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          architecture: ${{ matrix.os.archs }}
      - name: Dependencies
        run: |
          make venv
      - name: Build
        run: |
          source ./venv/bin/activate
          python3 -m build_wheel openroad-repo
      - name: Smoke Test
        run: |
          make test
      - name: Upload Wheels
        uses: actions/upload-artifact@v7
        with:
          name: openroad-python-wheels-${{ matrix.os.runner }}-${{ matrix.os.arch }}
          path: ./dist/*
